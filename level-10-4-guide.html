      const previous = root.querySelector('[data-action="previous"]');
      const next = root.querySelector('[data-action="next"]');
      const section = root.querySelector('[data-field="section"]');
      const title = root.querySelector('[data-field="title"]');
      const board = root.querySelector('[data-field="board"]');
      const status = root.querySelector('[data-field="status"]');
      const moves = root.querySelector('[data-field="moves"]');
      let index = 0;
      function render() {
        const state = states[index];
        section.textContent = index === states.length - 1 ? 'Round clear' : `Section ${index + 1} of ${states.length - 1}`;
        title.textContent = state.title;
        board.src = state.image;
        board.alt = index === states.length - 1 ? 'World map after completing level 10-4' : `Starting position for section ${index + 1}: ${state.title}`;
        status.textContent = state.moves.length ? `Inputs ${state.first}–${state.last} · ${state.fires} flames before this section` : 'All 9 flames cleared. Verified in the supplied ROM.';
        moves.replaceChildren();
        for (let i = 0; i < state.moves.length; i += 5) {
          const group = document.createElement('code');
          group.textContent = state.moves.slice(i, i + 5).join(' ');
          moves.appendChild(group);
        }
        previous.disabled = index === 0;
        next.disabled = index === states.length - 1;
      }
      previous.addEventListener('click', () => { if (index > 0) { index--; render(); } });
      next.addEventListener('click', () => { if (index < states.length - 1) { index++; render(); } });
      render();
